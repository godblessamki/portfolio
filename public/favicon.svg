<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141622"/>
      <stop offset="100%" stop-color="#08090E"/>
    </linearGradient>

    <!-- S Gradient: Soft Lavender to Electric Violet -->
    <linearGradient id="sk-s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFBDFF"/>
      <stop offset="100%" stop-color="#8A5CFF"/>
    </linearGradient>

    <!-- K Gradient: Cyan to Electric Violet -->
    <linearGradient id="sk-k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EE0FF"/>
      <stop offset="100%" stop-color="#8A5CFF"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="sk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A5CFF" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#4D38F5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#sk-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="rgba(207, 189, 255, 0.22)" stroke-width="1"/>
  
  <!-- Subtle Kinetic Glow -->
  <circle cx="16" cy="16" r="11" fill="url(#sk-glow)"/>

  <!-- Letter 'S': Geometric kinetic path -->
  <path
    d="M 13.5 10.5 H 8.5 C 6.84 10.5 5.5 11.84 5.5 13.5 C 5.5 15.16 6.84 16.5 8.5 16.5 H 10.5 C 12.16 16.5 13.5 17.84 13.5 19.5 C 13.5 21.16 12.16 22.5 10.5 22.5 H 5.5"
    fill="none"
    stroke="url(#sk-s-grad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Letter 'K': Vertical stem + kinetic chevron -->
  <path
    d="M 18 8.5 V 23.5"
    fill="none"
    stroke="#CFBDFF"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <path
    d="M 26.5 10 L 18.5 16 L 26.5 22"
    fill="none"
    stroke="url(#sk-k-grad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
